# Example only. Same-host or shared-network-namespace collector required.
# Operator must supply a dedicated random token file; never commit its contents.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
scrape_configs:
  - job_name: customer-service-private
    metrics_path: /metrics
    scheme: http
    follow_redirects: false
    authorization:
      type: Bearer
      credentials_file: /run/secrets/customer_service_metrics_token
    static_configs:
      - targets: ['127.0.0.1:9107']
