# Install as /etc/systemd/journald@customer-service.conf.d/10-retention.conf.
# Scoped namespace only: never replace the host's global journald.conf.
[Journal]
Storage=persistent
SplitMode=none
Compress=yes
Seal=yes
SystemMaxUse=512M
SystemKeepFree=1G
RuntimeMaxUse=64M
MaxRetentionSec=14day
MaxFileSec=1day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
RateLimitIntervalSec=30s
RateLimitBurst=10000
